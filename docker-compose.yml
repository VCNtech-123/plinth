services:
  mongodb:
    image: mongo:7
    container_name: plinth-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: plinth
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - plinth-network

  redis:
    image: redis:7-alpine
    container_name: plinth-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - plinth-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:

    environment:
      - MONGO_URI=mongodb://admin:password@mongodb:27017/plinth?authSource=admin
      - REDIS_HOST=redis  
      - REDIS_PORT=6379   
      - NODE_ENV=development
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      redis:           
        condition: service_healthy

volumes:
  mongodb_data:
  redis_data:  

networks:
  plinth-network:
    driver: bridge